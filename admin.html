<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O.G CMS - International Parcel Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .front-input {
            width: 100%; background-color: #f4f4f5; border-radius: 0.5rem; padding: 0.85rem 1rem; font-size: 1rem; font-weight: 700; color: #1f2937; outline: none; border: 2px solid transparent; transition: all 0.2s;
        }
        .front-input:focus { border-color: #f59e0b; background-color: #ffffff; }
        select.front-input {
            appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23d97706' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.75rem center; background-repeat: no-repeat; background-size: 1.25em 1.25em; padding-right: 2.5rem; cursor: pointer;
        }
        select.front-input option { background-color: #ffffff; color: #1f2937; font-weight: 500; padding: 10px; }
        input[type="datetime-local"], input[type="date"] { appearance: none; -webkit-appearance: none; }
        .event-row { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center">

    <div class="w-full max-w-[480px]">
        <div class="flex justify-between items-center mb-6 px-2">
            <div class="flex items-center gap-3">
                <div class="relative w-10 h-10 flex items-center justify-center">
                    <svg class="absolute inset-0 w-full h-full text-black" viewBox="0 0 24 24" fill="currentColor"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
                    <svg class="absolute inset-[2px] w-[calc(100%-4px)] h-[calc(100%-4px)] text-yellow-400" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3L5 6v5c0 4.42 3.05 8.57 7 9.63 3.95-1.06 7-5.21 7-9.63V6l-7-3z"/></svg>
                    <span class="relative z-10 font-bold text-black text-xs tracking-tighter">ips</span>
                </div>
                <h1 class="text-xl font-bold text-gray-900">O.G CMS</h1>
            </div>
            <a href="index.html" class="text-[13px] font-bold text-gray-600 hover:text-gray-900 bg-white px-3 py-1.5 rounded-full border border-gray-200 shadow-sm transition-colors flex items-center gap-1">Back to Tracker</a>
        </div>

        <div id="mainFormCard" class="bg-white rounded-[20px] shadow-[0_8px_30px_rgb(0,0,0,0.08)] overflow-hidden mb-8">
            
            <div class="p-6 border-b border-gray-100">
                <h2 class="text-[16px] font-bold text-gray-800 uppercase tracking-wide mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path></svg>
                    Generate Tracking Code
                </h2>
                <div class="flex items-center gap-2">
                    <div class="bg-[#f4f4f5] rounded-l-md px-4 py-3.5 font-bold text-gray-500 text-[20px] flex items-center justify-center border-2 border-transparent">IPS</div>
                    <input type="text" id="cmsCodeNumbers" placeholder="000000" maxlength="6" class="front-input text-center text-[20px] text-amber-600 uppercase rounded-l-none rounded-r-md py-3.5" readonly>
                    <button id="generateBtn" onclick="generateCode()" class="bg-amber-500 hover:bg-amber-600 text-white p-3.5 rounded-md shadow-md transition-all" title="Generate Random Code">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    </button>
                </div>
            </div>

            <div class="p-6 border-b border-gray-100">
                <h2 class="text-[16px] font-bold text-gray-800 uppercase tracking-wide mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Shipment Overview
                </h2>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Est. Arrival Date <span class="text-red-500">*</span></label>
                        <input type="date" id="cmsEstDate" class="front-input text-[14px]" required>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Time Zone <span class="text-red-500">*</span></label>
                        <select id="cmsTimezone" class="front-input text-[14px]">
                            <option value="Z">GMT / UTC (Default)</option>
                            <option value="-05:00">EST (New York, UTC-5)</option>
                            <option value="-06:00">CST (Chicago, UTC-6)</option>
                            <option value="-07:00">MST (Denver, UTC-7)</option>
                            <option value="-08:00">PST (Los Angeles, UTC-8)</option>
                            <option value="+00:00">WET (London, UTC+0)</option>
                            <option value="+01:00">CET (Paris/Berlin, UTC+1)</option>
                            <option value="+05:30">IST (India, UTC+5:30)</option>
                            <option value="+08:00">SGT (Singapore, UTC+8)</option>
                            <option value="+09:00">JST (Tokyo, UTC+9)</option>
                            <option value="+10:00">AEST (Sydney, UTC+10)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-3">
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Dest. Country</label>
                        <select id="destCountry" class="front-input text-[13px]" onchange="updateDestStates()"></select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Dest. State/Region</label>
                        <select id="destState" class="front-input text-[13px]" onchange="updateDestCities()"></select>
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-gray-500 uppercase tracking-wider mb-1.5">Dest. City Hub</label>
                    <select id="destCity" class="front-input text-[13px]"></select>
                </div>
                <p class="text-[10px] text-gray-400 mt-2">* Set an Est. Arrival Date to unlock the Timeline Builder.</p>
            </div>

            <div id="timelineSection" class="p-6 bg-gray-50/50 opacity-50 pointer-events-none transition-opacity duration-300">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-[16px] font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                        <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                        Timeline Builder
                    </h2>
                </div>
                <p id="timelineHint" class="text-[12px] text-red-500 font-bold mb-4">Please set an Est. Arrival Date above to unlock this section.</p>
                
                <div id="eventsContainer" class="space-y-4"></div>

                <button onclick="addStage()" class="w-full mt-4 bg-white border-2 border-dashed border-gray-300 hover:border-amber-500 hover:text-amber-600 text-gray-600 font-bold py-3 rounded-xl text-[14px] transition-colors flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Add Next Stage
                </button>
            </div>

            <div class="p-6 bg-white border-t border-gray-100 flex flex-col gap-3">
                <button id="saveBtn" onclick="saveTrackingCode()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-4 rounded-full shadow-[0_4px_14px_0_rgba(245,158,11,0.4)] transition-colors text-[17px] disabled:opacity-70 disabled:cursor-not-allowed">
                    Save New Tracking Code
                </button>
                <button id="cancelEditBtn" onclick="resetForm()" class="w-full hidden bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-4 rounded-full transition-colors text-[17px]">
                    Cancel Edit
                </button>
            </div>
        </div>

        <div class="bg-white rounded-[20px] shadow-[0_8px_30px_rgb(0,0,0,0.08)] overflow-hidden">
            <div class="p-6 border-b border-gray-100 bg-gray-50/50 flex justify-between items-center">
                <div>
                    <h2 class="text-[16px] font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path></svg>
                        Manage Database
                    </h2>
                </div>
                <div id="listLoader" class="hidden">
                    <svg class="animate-spin h-5 w-5 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </div>
            </div>
            <div id="codesList" class="divide-y divide-gray-100 max-h-[500px] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://ipstracker.jkay99781.workers.dev/"; 

        const EVENT_MESSAGES = [
            "Order Placed", 
            "Order Shipped", 
            "Label Created", 
            "Picked Up by Carrier",
            "Departed Origin Facility", 
            "Arrived at Origin Hub",
            "Departed Origin Hub",
            "Arrived at Sorting Center", 
            "Departed Sorting Center", 
            "Arrived at Regional Hub", 
            "Departed Regional Hub", 
            "Customs Clearance Started",
            "Held at Customs",
            "Customs Released",
            "In Transit to Next Facility",
            "Arrived at Local Facility",
            "Out for Delivery", 
            "Delivery Attempted",
            "Delivered, Front Door",
            "Returned to Sender"
        ];

        // MASSIVE EXPANSION OF LOCATIONS (UK, Europe, and existing)
        const locationData = {
            "US": { 
                "Alabama": ["Birmingham, AL", "Montgomery, AL"], "Alaska": ["Anchorage, AK"], "Arizona": ["Phoenix, AZ", "Tucson, AZ"], "Arkansas": ["Little Rock, AR"], "California": ["Los Angeles, CA", "San Francisco, CA", "San Diego, CA", "Sacramento, CA"], "Colorado": ["Denver, CO", "Colorado Springs, CO"], "Connecticut": ["Hartford, CT", "New Haven, CT"], "Delaware": ["Wilmington, DE"], "Florida": ["Miami, FL", "Orlando, FL", "Tampa, FL", "Jacksonville, FL"], "Georgia": ["Atlanta, GA", "Savannah, GA"], "Hawaii": ["Honolulu, HI"], "Idaho": ["Boise, ID"], "Illinois": ["Chicago, IL", "Springfield, IL"], "Indiana": ["Indianapolis, IN"], "Iowa": ["Des Moines, IA"], "Kansas": ["Wichita, KS"], "Kentucky": ["Louisville, KY", "Lexington, KY"], "Louisiana": ["New Orleans, LA", "Baton Rouge, LA"], "Maine": ["Portland, ME"], "Maryland": ["Baltimore, MD"], "Massachusetts": ["Boston, MA", "Worcester, MA"], "Michigan": ["Detroit, MI", "Grand Rapids, MI"], "Minnesota": ["Minneapolis, MN", "St. Paul, MN"], "Mississippi": ["Jackson, MS"], "Missouri": ["Kansas City, MO", "St. Louis, MO"], "Montana": ["Billings, MT"], "Nebraska": ["Omaha, NE"], "Nevada": ["Las Vegas, NV", "Reno, NV"], "New Hampshire": ["Manchester, NH"], "New Jersey": ["Newark, NJ", "Jersey City, NJ"], "New Mexico": ["Albuquerque, NM"], "New York": ["New York, NY", "Buffalo, NY", "Albany, NY"], "North Carolina": ["Charlotte, NC", "Raleigh, NC"], "North Dakota": ["Fargo, ND"], "Ohio": ["Columbus, OH", "Cleveland, OH", "Cincinnati, OH"], "Oklahoma": ["Oklahoma City, OK", "Tulsa, OK"], "Oregon": ["Portland, OR", "Salem, OR"], "Pennsylvania": ["Philadelphia, PA", "Pittsburgh, PA"], "Rhode Island": ["Providence, RI"], "South Carolina": ["Charleston, SC", "Columbia, SC"], "South Dakota": ["Sioux Falls, SD"], "Tennessee": ["Memphis, TN", "Nashville, TN", "Knoxville, TN"], "Texas": ["Houston, TX", "Dallas, TX", "Austin, TX", "San Antonio, TX"], "Utah": ["Salt Lake City, UT"], "Vermont": ["Burlington, VT"], "Virginia": ["Virginia Beach, VA", "Richmond, VA"], "Washington": ["Seattle, WA", "Spokane, WA"], "West Virginia": ["Charleston, WV"], "Wisconsin": ["Milwaukee, WI", "Madison, WI"], "Wyoming": ["Cheyenne, WY"] 
            },
            "United Kingdom": {
                "England": ["London, England", "Birmingham, England", "Manchester, England", "Leeds, England", "Liverpool, England", "Sheffield, England", "Bristol, England", "Newcastle, England", "Nottingham, England", "Leicester, England", "Southampton, England", "Portsmouth, England", "Coventry, England", "Bradford, England", "Sunderland, England", "Salford, England"],
                "Scotland": ["Edinburgh, Scotland", "Glasgow, Scotland", "Aberdeen, Scotland", "Dundee, Scotland"],
                "Wales": ["Cardiff, Wales", "Swansea, Wales", "Newport, Wales"],
                "Northern Ireland": ["Belfast, Northern Ireland", "Derry, Northern Ireland"]
            },
            "Ireland": { "Leinster": ["Dublin, Ireland"], "Munster": ["Cork, Ireland", "Shannon, Ireland"] },
            "Netherlands": { "North Holland": ["Amsterdam, Netherlands"], "South Holland": ["Rotterdam, Netherlands", "The Hague, Netherlands"], "North Brabant": ["Eindhoven, Netherlands"] },
            "Belgium": { "Brussels": ["Brussels, Belgium"], "Flanders": ["Antwerp, Belgium", "Ghent, Belgium"], "Wallonia": ["Liege, Belgium"] },
            "Spain": { "Madrid": ["Madrid, Spain"], "Catalonia": ["Barcelona, Spain"], "Valencia": ["Valencia, Spain"], "Andalusia": ["Seville, Spain"], "Aragon": ["Zaragoza, Spain"] },
            "Italy": { "Lazio": ["Rome, Italy"], "Lombardy": ["Milan, Italy"], "Campania": ["Naples, Italy"], "Piedmont": ["Turin, Italy"], "Tuscany": ["Florence, Italy"], "Liguria": ["Genoa, Italy"] },
            "Switzerland": { "Zurich": ["Zurich, Switzerland"], "Geneva": ["Geneva, Switzerland"], "Basel-Stadt": ["Basel, Switzerland"] },
            "Sweden": { "Stockholm": ["Stockholm, Sweden"], "Vastra Gotaland": ["Gothenburg, Sweden"], "Skane": ["Malmo, Sweden"] },
            "Norway": { "Oslo": ["Oslo, Norway"], "Vestland": ["Bergen, Norway"] },
            "Denmark": { "Capital Region": ["Copenhagen, Denmark"], "Central Jutland": ["Aarhus, Denmark"] },
            "Germany": { "Bavaria": ["Munich, Germany", "Nuremberg, Germany"], "North Rhine-Westphalia": ["Cologne, Germany", "Dusseldorf, Germany"], "Berlin": ["Berlin, Germany"], "Hesse": ["Frankfurt, Germany"] },
            "France": { "Ile-de-France": ["Paris, France"], "Provence-Alpes-Cote d'Azur": ["Marseille, France", "Nice, France"], "Auvergne-Rhone-Alpes": ["Lyon, France"] },
            "Canada": { "Ontario": ["Toronto, Canada", "Ottawa, Canada", "Mississauga, Canada"], "Quebec": ["Montreal, Canada", "Quebec City, Canada"], "British Columbia": ["Vancouver, Canada", "Victoria, Canada", "Surrey, Canada"], "Alberta": ["Calgary, Canada", "Edmonton, Canada"] },
            "Australia": { "New South Wales": ["Sydney, Australia", "Newcastle, Australia"], "Victoria": ["Melbourne, Australia", "Geelong, Australia"], "Queensland": ["Brisbane, Australia", "Gold Coast, Australia"], "Western Australia": ["Perth, Australia"] },
            "Japan": { "Tokyo": ["Tokyo, Japan"], "Osaka": ["Osaka, Japan"], "Aichi": ["Nagoya, Japan"], "Fukuoka": ["Fukuoka, Japan"] },
            "China": { "Guangdong": ["Guangzhou, China", "Shenzhen, China"], "Shanghai": ["Shanghai, China"], "Beijing": ["Beijing, China"], "Zhejiang": ["Hangzhou, China"] }
        };

        const eventsContainer = document.getElementById('eventsContainer');
        const timelineSection = document.getElementById('timelineSection');
        const timelineHint = document.getElementById('timelineHint');
        const estDateInput = document.getElementById('cmsEstDate');
        const cmsTimezone = document.getElementById('cmsTimezone');
        const destCountry = document.getElementById('destCountry');
        const destState = document.getElementById('destState');
        const destCity = document.getElementById('destCity');
        const codesListContainer = document.getElementById('codesList');
        const listLoader = document.getElementById('listLoader');
        
        const saveBtn = document.getElementById('saveBtn');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const generateBtn = document.getElementById('generateBtn');

        let db = {}; 
        let editingCode = null;

        function init() {
            generateCode();
            initDestinationDropdowns();
            fetchAllCodes(); 
        }

        async function fetchAllCodes() {
            listLoader.classList.remove('hidden');
            codesListContainer.innerHTML = '';
            try {
                const res = await fetch(`${API_URL}?action=list`);
                if (res.ok) {
                    const data = await res.json();
                    db = {};
                    data.forEach(item => {
                        db[item.id] = {
                            status: item.status,
                            destination: { location: item.dest_location, estimatedDate: item.est_date, actualDate: item.actual_date },
                            events: item.events,
                            rawEstDate: item.est_date,
                            rawDest: { country: "US", state: "California", city: item.dest_location }
                        };
                    });
                    renderCodeList();
                } else {
                    codesListContainer.innerHTML = `<div class="p-6 text-center text-red-500 text-[14px]">Failed to load data.</div>`;
                }
            } catch (e) {
                codesListContainer.innerHTML = `<div class="p-6 text-center text-red-500 text-[14px]">Network error.</div>`;
            } finally {
                listLoader.classList.add('hidden');
            }
        }

        function initDestinationDropdowns() {
            destCountry.innerHTML = Object.keys(locationData).sort().map(c => `<option value="${c}">${c}</option>`).join('');
            updateDestStates();
        }

        function updateDestStates() {
            const country = destCountry.value;
            destState.innerHTML = Object.keys(locationData[country]).sort().map(s => `<option value="${s}">${s}</option>`).join('');
            updateDestCities();
        }

        function updateDestCities() {
            const country = destCountry.value;
            const state = destState.value;
            destCity.innerHTML = locationData[country][state].sort().map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function updateDateConstraints() {
            const estDateVal = estDateInput.value;
            if (!estDateVal) return;
            const timeInputs = document.querySelectorAll('.event-time');
            timeInputs.forEach((input, index) => {
                input.max = `${estDateVal}T23:59`;
                if (index > 0) {
                    const prevInput = timeInputs[index - 1];
                    if (prevInput.value) input.min = prevInput.value;
                    else input.removeAttribute('min');
                }
            });
        }

        estDateInput.addEventListener('change', function() {
            if (this.value) {
                timelineSection.classList.remove('opacity-50', 'pointer-events-none');
                timelineHint.classList.add('hidden');
                if (eventsContainer.children.length === 0) addStage();
                else updateDateConstraints();
            } else {
                timelineSection.classList.add('opacity-50', 'pointer-events-none');
                timelineHint.classList.remove('hidden');
                eventsContainer.innerHTML = ''; 
            }
        });

        function generateCode() {
            if (editingCode) return; 
            document.getElementById('cmsCodeNumbers').value = Math.floor(100000 + Math.random() * 900000);
        }

        function addStage(eventData = null) {
            const estDateVal = estDateInput.value;
            if (!estDateVal) return; 

            const rows = document.querySelectorAll('.event-row');
            const isFirstStage = rows.length === 0;
            const rowIndex = rows.length + 1;
            
            if (!isFirstStage && !eventData) {
                const lastRow = rows[rows.length - 1];
                const lastMessage = lastRow.querySelector('.event-message').value;
                const lastTime = lastRow.querySelector('.event-time').value;
                if (!lastTime) { alert("Please fill in the Date & Time for the current stage before adding a new one."); return; }
                if (lastMessage.includes("Delivered") || lastMessage === "Returned to Sender") { alert("This package journey is complete."); return; }
            }

            const div = document.createElement('div');
            div.className = "relative bg-white p-4 rounded-xl border border-gray-200 shadow-[0_2px_10px_rgb(0,0,0,0.02)] flex flex-col gap-3 event-row";
            
            let countryOptions = Object.keys(locationData).sort().map(c => `<option value="${c}">${c}</option>`).join('');
            
            let messageFieldHTML = '';
            if (isFirstStage) {
                messageFieldHTML = `
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Stage Action (Fixed)</label>
                        <div class="front-input bg-gray-200 text-gray-600 text-[14px] py-2.5 cursor-not-allowed flex items-center">Order Placed</div>
                        <input type="hidden" class="event-message" value="Order Placed">
                    </div>
                `;
            } else {
                let messageOptions = EVENT_MESSAGES.slice(1).map(msg => `<option value="${msg}">${msg}</option>`).join('');
                messageFieldHTML = `
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Stage Action</label>
                        <select class="front-input event-message text-[14px] bg-[#f8f8f9] py-2.5">${messageOptions}</select>
                    </div>
                `;
            }

            let deleteBtnHTML = isFirstStage ? '' : `
                <button onclick="this.closest('.event-row').remove(); updateDateConstraints();" class="text-gray-400 hover:text-red-500 bg-gray-50 hover:bg-red-50 rounded-full p-1.5 transition-colors" title="Remove Stage">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            `;

            div.innerHTML = `
                <div class="flex justify-between items-center mb-1 pb-2 border-b border-gray-100">
                    <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">Stage ${rowIndex}</span>
                    ${deleteBtnHTML}
                </div>
                ${messageFieldHTML}
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Country</label>
                        <select class="front-input event-country text-[13px] bg-[#f8f8f9] py-2.5" onchange="updateStates(this)">${countryOptions}</select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">State / Region</label>
                        <select class="front-input event-state text-[13px] bg-[#f8f8f9] py-2.5" onchange="updateCities(this)"></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">City Hub</label>
                        <select class="front-input event-city text-[13px] bg-[#f8f8f9] py-2.5"></select>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-1 block">Date & Time <span class="text-red-400">*</span></label>
                        <input type="datetime-local" class="front-input event-time text-[13px] bg-[#f8f8f9] py-2.5" onchange="updateDateConstraints()">
                    </div>
                </div>
            `;
            eventsContainer.appendChild(div);
            
            if (eventData) {
                if (!isFirstStage) div.querySelector('.event-message').value = eventData.message;
                const dateObj = new Date(eventData.raw_date || eventData.time);
                if (!isNaN(dateObj)) {
                    const tzOffset = dateObj.getTimezoneOffset() * 60000;
                    const localISOTime = (new Date(dateObj - tzOffset)).toISOString().slice(0, 16);
                    div.querySelector('.event-time').value = localISOTime;
                }
                const cityString = eventData.location;
                let foundCountry = Object.keys(locationData)[0];
                let foundState = Object.keys(locationData[foundCountry])[0];
                for (const country in locationData) {
                    for (const state in locationData[country]) {
                        if (locationData[country][state].includes(cityString)) {
                            foundCountry = country;
                            foundState = state;
                            break;
                        }
                    }
                }
                div.querySelector('.event-country').value = foundCountry;
                updateStates(div.querySelector('.event-country')); 
                div.querySelector('.event-state').value = foundState;
                updateCities(div.querySelector('.event-state')); 
                div.querySelector('.event-city').value = cityString;
            } else {
                updateStates(div.querySelector('.event-country'));
            }
            updateDateConstraints();
        }

        function updateStates(countrySelect) {
            const row = countrySelect.closest('.event-row');
            const stateSelect = row.querySelector('.event-state');
            stateSelect.innerHTML = Object.keys(locationData[countrySelect.value]).sort().map(s => `<option value="${s}">${s}</option>`).join('');
            updateCities(stateSelect);
        }

        function updateCities(stateSelect) {
            const row = stateSelect.closest('.event-row');
            const citySelect = row.querySelector('.event-city');
            const country = row.querySelector('.event-country').value;
            citySelect.innerHTML = locationData[country][stateSelect.value].sort().map(c => `<option value="${c}">${c}</option>`).join('');
        }

        async function saveTrackingCode() {
            const numbers = document.getElementById('cmsCodeNumbers').value.trim();
            const estDateVal = estDateInput.value;
            const timezoneOffset = cmsTimezone.value;

            if (numbers.length !== 6 || isNaN(numbers)) { alert("Please generate a valid 6-digit number."); return; }
            if (!estDateVal) { alert("Please set an Estimated Arrival Date."); return; }

            const code = `IPS${numbers}`;
            const d = new Date(estDateVal + 'T12:00:00'); 
            const destDate = d.toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });

            const events = [];
            const rows = document.querySelectorAll('.event-row');
            if (rows.length === 0) { alert("Please add at least one stage."); return; }

            let validationError = "";
            let previousDate = null;
            let finalStatus = "Pending Delivery"; 

            rows.forEach((row, index) => {
                const msg = row.querySelector('.event-message').value;
                const loc = row.querySelector('.event-city').value;
                const timeRaw = row.querySelector('.event-time').value; 
                
                if (!timeRaw) validationError = `Stage ${index + 1} (${msg}) is missing a Date & Time.`;
                
                const eventDate = new Date(timeRaw);
                const estDateObj = new Date(estDateVal + 'T23:59:59'); 
                if (eventDate > estDateObj) validationError = `Stage ${index + 1} (${msg}) is dated after the Estimated Arrival Date.`;
                if (previousDate && eventDate < previousDate) validationError = `Stage ${index + 1} (${msg}) cannot be dated before the previous stage.`;
                previousDate = eventDate;

                const rawDateWithTz = `${timeRaw}:00${timezoneOffset}`;

                const datePart = eventDate.toLocaleDateString('en-US', { month: 'short', day: '2-digit' });
                const timePart = eventDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true }).toLowerCase();
                
                if (index === rows.length - 1 && (msg.includes("Delivered") || msg === "Returned to Sender")) {
                    finalStatus = (msg === "Returned to Sender") ? "Pending Delivery" : "Delivered"; 
                }

                events.push({ location: loc, time: `${datePart}, ${timePart}`, message: msg, rawDate: rawDateWithTz });
            });

            if (validationError) { alert(validationError); return; }

            const newData = {
                code: code,
                status: finalStatus,
                destination: { 
                    location: destCity.value, 
                    estimatedDate: destDate, 
                    actualDate: finalStatus === "Delivered" ? events[events.length - 1].time : null 
                },
                events: events
            };

            saveBtn.innerText = "Saving...";
            saveBtn.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newData)
                });
                if (response.ok) {
                    alert(`✅ Success! Code ${code} ${editingCode ? 'updated' : 'generated'} on Cloudflare.`);
                    resetForm();
                    fetchAllCodes(); 
                } else {
                    alert("Failed to save to database.");
                }
            } catch (error) {
                alert("Network error while saving.");
            } finally {
                saveBtn.innerText = editingCode ? "Update Tracking Code" : "Save New Tracking Code";
                saveBtn.disabled = false;
            }
        }

        function resetForm() {
            editingCode = null;
            document.getElementById('cmsCodeNumbers').value = '';
            eventsContainer.innerHTML = '';
            document.getElementById('cmsEstDate').value = '';
            cmsTimezone.value = "Z"; 
            timelineSection.classList.add('opacity-50', 'pointer-events-none');
            timelineHint.classList.remove('hidden');
            saveBtn.innerText = "Save New Tracking Code";
            saveBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
            saveBtn.classList.add('bg-amber-500', 'hover:bg-amber-600');
            cancelEditBtn.classList.add('hidden');
            generateBtn.disabled = false;
            generateBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'hover:bg-amber-600');
            generateCode();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderCodeList() {
            const codes = Object.keys(db); 
            codesListContainer.innerHTML = '';
            if (codes.length === 0) {
                codesListContainer.innerHTML = `<div class="p-6 text-center text-gray-500 text-[14px]">No custom codes found.</div>`;
                return;
            }

            codes.forEach(code => {
                const data = db[code];
                const div = document.createElement('div');
                div.className = "p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-0";
                const isDelivered = data.status === "Delivered";
                const badgeColor = isDelivered ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700";
                div.innerHTML = `
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span class="font-bold text-[16px] text-gray-900">${code}</span>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${badgeColor}">${data.status}</span>
                        </div>
                        <p class="text-[12px] text-gray-500">To: ${data.destination.location}</p>
                    </div>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button onclick="copyCode('${code}')" class="flex-1 sm:flex-none text-indigo-600 bg-indigo-50 hover:bg-indigo-100 p-2 rounded-lg transition-colors" title="Copy Code">
                            <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </button>
                        <button onclick="editCode('${code}')" class="flex-1 sm:flex-none text-amber-600 bg-amber-50 hover:bg-amber-100 p-2 rounded-lg transition-colors" title="Edit Code">
                            <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        </button>
                        <button onclick="deleteCode('${code}')" class="flex-1 sm:flex-none text-red-600 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition-colors" title="Delete Code">
                            <svg class="w-5 h-5 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        </button>
                    </div>
                `;
                codesListContainer.appendChild(div);
            });
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => { alert(`📋 Copied ${code} to clipboard!`); });
        }

        async function deleteCode(code) {
            if (confirm(`Are you sure you want to permanently delete ${code}?`)) {
                try {
                    const res = await fetch(`${API_URL}?code=${code}`, { method: 'DELETE' });
                    if (res.ok) { delete db[code]; renderCodeList(); if (editingCode === code) resetForm(); }
                    else { alert("Failed to delete."); }
                } catch (e) { alert("Network error."); }
            }
        }

        function editCode(code) {
            const data = db[code];
            editingCode = code;
            saveBtn.innerText = "Update Tracking Code";
            saveBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
            saveBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            cancelEditBtn.classList.remove('hidden');
            generateBtn.disabled = true;
            generateBtn.classList.add('opacity-50', 'cursor-not-allowed', 'hover:bg-amber-500'); 
            
            document.getElementById('cmsCodeNumbers').value = code.replace('IPS', '');
            
            let estDateRaw = data.destination.estimatedDate;
            if (estDateRaw && estDateRaw !== "TBD") {
                const parts = estDateRaw.replace(',', '').split(' ');
                const monthMap = {Jan:"01", Feb:"02", Mar:"03", Apr:"04", May:"05", Jun:"06", Jul:"07", Aug:"08", Sep:"09", Oct:"10", Nov:"11", Dec:"12"};
                if (parts.length === 3) {
                    document.getElementById('cmsEstDate').value = `${parts[2]}-${monthMap[parts[0]]}-${parts[1].padStart(2, '0')}`;
                }
            }

            const destLoc = data.destination.location;
            let foundCountry = "US", foundState = "California";
            for (const country in locationData) {
                for (const state in locationData[country]) {
                    if (locationData[country][state].includes(destLoc)) { foundCountry = country; foundState = state; break; }
                }
            }
            destCountry.value = foundCountry;
            updateDestStates();
            destState.value = foundState;
            updateDestCities();
            destCity.value = destLoc;

            timelineSection.classList.remove('opacity-50', 'pointer-events-none');
            timelineHint.classList.add('hidden');
            eventsContainer.innerHTML = '';

            data.events.forEach(event => {
                addStage({ location: event.location, message: event.message, time: event.time, raw_date: event.raw_date });
            });

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        init();
    </script>
</body>
</html>
